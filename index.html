<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Go-CyberChef (WASM Edition)</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#252526">
    <link rel="stylesheet" href="style.css">
    <script src="wasm_exec.js"></script>
    <script src="script.js" defer></script>
</head>
<body>
    <div class="header">
        <div class="title-container">
            <img src="logo.svg" alt="Go-CyberChef Logo" style="height: 40px; margin-right: 10px; vertical-align: middle;">
            <h1>Go-CyberChef <span style="font-size: 0.7em; color: #0098ff;">(WASM Edition)</span></h1>
        </div>
        <button id="installAppButton" title="Install App">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
        </button>
        <button id="downloadAppButton" title="Download App">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM17 13l-5 5-5-5h3V9h4v4h3z"/></svg>
        </button>
    </div>
    <div class="status-bar">
        <span id="wasmStatus">Initializing...</span>
        <span id="errorDisplay"></span>
        <div id="loopStatusContainer">
            <div id="loopStatusMessage"></div>
            <div id="loopProgressBarOuter">
                <div id="loopProgressBarInner"></div>
            </div>
        </div>
    </div>
    <div class="main-container">
        <div class="column operations-list">
            <h3>Operations</h3>
            <button data-op-name="To Base64" data-op-func-key="goEncodeBase64" onclick="addProcessingOperation('To Base64', 'goEncodeBase64')">To Base64</button>
            <button data-op-name="From Base64" data-op-func-key="goDecodeBase64" onclick="addProcessingOperation('From Base64', 'goDecodeBase64')">From Base64</button>
            <button data-op-name="To Hex" data-op-func-key="goEncodeHex" onclick="addProcessingOperation('To Hex', 'goEncodeHex')">To Hex</button>
            <button data-op-name="From Hex" data-op-func-key="goDecodeHex" onclick="addProcessingOperation('From Hex', 'goDecodeHex')">From Hex</button>
            <button data-op-name="MD5" data-op-func-key="goMD5" onclick="addProcessingOperation('MD5', 'goMD5')">MD5</button>
            <button data-op-name="SHA1" data-op-func-key="goSHA1" onclick="addProcessingOperation('SHA1', 'goSHA1')">SHA1</button>
            <button data-op-name="SHA256" data-op-func-key="goSHA256" onclick="addProcessingOperation('SHA256', 'goSHA256')">SHA256</button>
            <button data-op-name="SHA512" data-op-func-key="goSHA512" onclick="addProcessingOperation('SHA512', 'goSHA512')">SHA512</button>
            <button data-op-name="URL Encode" data-op-func-key="goURLEncode" onclick="addProcessingOperation('URL Encode', 'goURLEncode')">URL Encode</button>
            <button data-op-name="URL Decode" data-op-func-key="goURLDecode" onclick="addProcessingOperation('URL Decode', 'goURLDecode')">URL Decode</button>
            <button data-op-name="To Upper Case" data-op-func-key="goToUpperCase" onclick="addProcessingOperation('To Upper Case', 'goToUpperCase')">To Upper Case</button>
            <button data-op-name="To Lower Case" data-op-func-key="goToLowerCase" onclick="addProcessingOperation('To Lower Case', 'goToLowerCase')">To Lower Case</button>
            <button data-op-name="AES Encrypt" data-op-func-key="goAESEncrypt" onclick="addProcessingOperation('AES Encrypt', 'goAESEncrypt')">AES Encrypt</button>
            <button data-op-name="AES Decrypt" data-op-func-key="goAESDecrypt" onclick="addProcessingOperation('AES Decrypt', 'goAESDecrypt')">AES Decrypt</button>
            <button data-op-name="To Base32" data-op-func-key="goEncodeBase32" onclick="addProcessingOperation('To Base32', 'goEncodeBase32')">To Base32</button>
            <button data-op-name="From Base32" data-op-func-key="goDecodeBase32" onclick="addProcessingOperation('From Base32', 'goDecodeBase32')">From Base32</button>
            <button data-op-name="ROT13" data-op-func-key="goROT13" onclick="addProcessingOperation('ROT13', 'goROT13')">ROT13</button>
            <button data-op-name="Reverse" data-op-func-key="goReverse" onclick="addProcessingOperation('Reverse', 'goReverse')">Reverse</button>
            <button data-op-name="To Binary" data-op-func-key="goEncodeBinary" onclick="addProcessingOperation('To Binary', 'goEncodeBinary')">To Binary</button>
            <button data-op-name="From Binary" data-op-func-key="goDecodeBinary" onclick="addProcessingOperation('From Binary', 'goDecodeBinary')">From Binary</button>
            <button data-op-name="To Octal" data-op-func-key="goEncodeOctal" onclick="addProcessingOperation('To Octal', 'goEncodeOctal')">To Octal</button>
            <button data-op-name="From Octal" data-op-func-key="goDecodeOctal" onclick="addProcessingOperation('From Octal', 'goDecodeOctal')">From Octal</button>
            <button data-op-name="HTML Encode" data-op-func-key="goHTMLEncode" onclick="addProcessingOperation('HTML Encode', 'goHTMLEncode')">HTML Encode</button>
            <button data-op-name="HTML Decode" data-op-func-key="goHTMLDecode" onclick="addProcessingOperation('HTML Decode', 'goHTMLDecode')">HTML Decode</button>
            <button data-op-name="Strip HTML" data-op-func-key="goStripHTML" onclick="addProcessingOperation('Strip HTML', 'goStripHTML')">Strip HTML</button>
            <button data-op-name="Remove Whitespace" data-op-func-key="goRemoveWhitespace" onclick="addProcessingOperation('Remove Whitespace', 'goRemoveWhitespace')">Remove Whitespace</button>
            <button data-op-name="Defang URL" data-op-func-key="goDefangURL" onclick="addProcessingOperation('Defang URL', 'goDefangURL')">Defang URL</button>
            <button data-op-name="Defang IP" data-op-func-key="goDefangIP" onclick="addProcessingOperation('Defang IP', 'goDefangIP')">Defang IP</button>
            <button data-op-name="Sort Lines" data-op-func-key="goSortLines" onclick="addProcessingOperation('Sort Lines', 'goSortLines')">Sort Lines</button>
            <button data-op-name="Reverse Lines" data-op-func-key="goReverseLines" onclick="addProcessingOperation('Reverse Lines', 'goReverseLines')">Reverse Lines</button>
            <button data-op-name="Unique Lines" data-op-func-key="goUniqueLines" onclick="addProcessingOperation('Unique Lines', 'goUniqueLines')">Unique Lines</button>
            <hr style="border-color: #444; margin: 15px 0;">
            <button data-op-name="Loop Start" data-op-type="loopStart" onclick="promptAddLoopStart()">Add Loop Start</button>
            <button data-op-name="Loop End" data-op-type="loopEnd" onclick="promptAddLoopEnd()">Add Loop End</button>
            <!-- Future operations will be added here -->
        </div>
        
        <div class="column recipe-column">
            <h3>Recipe</h3>
            <div id="recipeContainer">
                <!-- Recipe items will be dynamically added here by JavaScript -->
            </div>
            <button id="bakeButton" onclick="bake()">Bake!</button>
            <div id="processingTime"></div>
        </div>
        
        <div class="column io-column" style="flex: 2;">
            <h3>Input</h3>
            <textarea id="inputTextArea" placeholder="Enter your data here..."></textarea>
        </div>
        
        <div class="column io-column" style="flex: 2;">
            <h3>Output</h3>
            <textarea id="outputTextArea" readonly placeholder="Output will appear here after baking..."></textarea>
        </div>
    </div>
</body>
</html>
